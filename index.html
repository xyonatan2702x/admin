<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>לוח בקרה - Dashboard</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Segoe UI', 'Tahoma', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            overscroll-behavior: none;
            touch-action: pan-y;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        }

        @keyframes bounce-in {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .celebration-animation {
            animation: bounce-in 0.5s ease-out;
        }

        @keyframes slide-up {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .slide-up {
            animation: slide-up 0.3s ease-out;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .fade-in {
            animation: fade-in 0.3s ease-out;
        }

        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        .slide-in-right {
            animation: slide-in-right 0.3s ease-out;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Sidebar active item */
        .nav-item-active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(168, 85, 247, 0.3));
            border-right: 3px solid #818cf8;
        }

        /* Priority colors */
        .priority-urgent { border-right-color: #ef4444; }
        .priority-high { border-right-color: #f97316; }
        .priority-medium { border-right-color: #eab308; }
        .priority-low { border-right-color: #22c55e; }

        /* Checkbox animation */
        .task-checkbox {
            transition: all 0.2s ease;
        }

        .task-checkbox:hover {
            transform: scale(1.1);
        }

        .task-checkbox.checked {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        /* Drag handle */
        .drag-handle {
            cursor: grab;
            opacity: 0.3;
            transition: opacity 0.2s;
        }

        .drag-handle:hover {
            opacity: 0.7;
        }

        /* Mobile bottom nav */
        @media (max-width: 768px) {
            .sidebar-desktop {
                display: none;
            }
        }

        @media (min-width: 769px) {
            .mobile-bottom-nav {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        // ===== UTILITY FUNCTIONS =====
        const generateId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);

        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleDateString('he-IL', { day: 'numeric', month: 'short' });
        };

        const isOverdue = (dateStr) => {
            if (!dateStr) return false;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return new Date(dateStr) < today;
        };

        const getDaysUntil = (dateStr) => {
            if (!dateStr) return null;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const target = new Date(dateStr);
            target.setHours(0, 0, 0, 0);
            return Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        };

        // ===== CONSTANTS =====
        const PRIORITIES = [
            { value: 'urgent', label: 'דחוף', color: 'bg-red-500', textColor: 'text-red-400', borderColor: 'border-red-500' },
            { value: 'high', label: 'גבוה', color: 'bg-orange-500', textColor: 'text-orange-400', borderColor: 'border-orange-500' },
            { value: 'medium', label: 'בינוני', color: 'bg-yellow-500', textColor: 'text-yellow-400', borderColor: 'border-yellow-500' },
            { value: 'low', label: 'נמוך', color: 'bg-green-500', textColor: 'text-green-400', borderColor: 'border-green-500' },
        ];

        const CATEGORIES = [
            { value: 'work', label: 'עבודה', icon: 'briefcase', color: 'text-blue-400' },
            { value: 'personal', label: 'אישי', icon: 'user', color: 'text-purple-400' },
            { value: 'health', label: 'בריאות', icon: 'heart', color: 'text-red-400' },
            { value: 'learning', label: 'לימודים', icon: 'book-open', color: 'text-green-400' },
            { value: 'finance', label: 'כספים', icon: 'wallet', color: 'text-yellow-400' },
            { value: 'home', label: 'בית', icon: 'home', color: 'text-orange-400' },
            { value: 'bots', label: 'בוטים', icon: 'bot', color: 'text-cyan-400' },
            { value: 'other', label: 'אחר', icon: 'folder', color: 'text-gray-400' },
        ];

        const NAV_ITEMS = [
            { id: 'tasks', label: 'משימות', icon: 'check-square', color: 'text-blue-400' },
            { id: 'habits', label: 'הרגלים', icon: 'trophy', color: 'text-yellow-400' },
            { id: 'bots', label: 'בוטים', icon: 'bot', color: 'text-cyan-400' },
            { id: 'analytics', label: 'ניתוח', icon: 'bar-chart-3', color: 'text-green-400' },
            { id: 'settings', label: 'הגדרות', icon: 'settings', color: 'text-gray-400' },
        ];

        // ===== TASK ITEM COMPONENT =====
        function TaskItem({ task, onToggle, onEdit, onDelete, onSubtaskToggle }) {
            const [expanded, setExpanded] = useState(false);
            const priority = PRIORITIES.find(p => p.value === task.priority) || PRIORITIES[2];
            const category = CATEGORIES.find(c => c.value === task.category) || CATEGORIES[7];
            const daysUntil = getDaysUntil(task.dueDate);
            const overdue = isOverdue(task.dueDate) && !task.completed;
            const subtasksDone = task.subtasks ? task.subtasks.filter(s => s.completed).length : 0;
            const subtasksTotal = task.subtasks ? task.subtasks.length : 0;

            return (
                <div className={`group rounded-xl border-r-4 transition-all duration-200 ${
                    task.completed
                        ? 'bg-white bg-opacity-5 border-green-500 opacity-60'
                        : overdue
                            ? 'bg-red-500 bg-opacity-5 border-red-500'
                            : `bg-white bg-opacity-5 ${priority.borderColor}`
                } hover:bg-opacity-10`}>
                    <div className="p-3 sm:p-4">
                        <div className="flex items-start gap-3">
                            {/* Checkbox */}
                            <button
                                onClick={() => onToggle(task.id)}
                                className={`task-checkbox flex-shrink-0 w-6 h-6 mt-0.5 rounded-lg border-2 flex items-center justify-center transition-all touch-manipulation ${
                                    task.completed
                                        ? 'bg-green-500 border-green-500 text-white checked'
                                        : 'border-gray-500 hover:border-gray-300'
                                }`}
                            >
                                {task.completed && <i data-lucide="check" className="w-4 h-4"></i>}
                            </button>

                            {/* Content */}
                            <div className="flex-1 min-w-0">
                                <div className="flex items-start justify-between gap-2">
                                    <h3 className={`font-medium text-sm sm:text-base ${
                                        task.completed ? 'line-through text-gray-500' : 'text-white'
                                    }`}>
                                        {task.title}
                                    </h3>
                                    <div className="flex items-center gap-1 flex-shrink-0">
                                        <button
                                            onClick={() => onEdit(task)}
                                            className="opacity-0 group-hover:opacity-100 p-1.5 rounded-lg hover:bg-white hover:bg-opacity-10 text-gray-400 hover:text-white transition touch-manipulation"
                                        >
                                            <i data-lucide="edit-2" className="w-3.5 h-3.5"></i>
                                        </button>
                                        <button
                                            onClick={() => onDelete(task.id)}
                                            className="opacity-0 group-hover:opacity-100 p-1.5 rounded-lg hover:bg-red-500 hover:bg-opacity-20 text-gray-400 hover:text-red-400 transition touch-manipulation"
                                        >
                                            <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                        </button>
                                    </div>
                                </div>

                                {task.description && (
                                    <p className="text-gray-400 text-xs sm:text-sm mt-1 line-clamp-2">{task.description}</p>
                                )}

                                {/* Tags Row */}
                                <div className="flex flex-wrap items-center gap-2 mt-2">
                                    {/* Priority Badge */}
                                    <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs ${priority.color} bg-opacity-20 ${priority.textColor}`}>
                                        <span className={`w-1.5 h-1.5 rounded-full ${priority.color}`}></span>
                                        {priority.label}
                                    </span>

                                    {/* Category Badge */}
                                    <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs bg-white bg-opacity-10 ${category.color}`}>
                                        <i data-lucide={category.icon} className="w-3 h-3"></i>
                                        {category.label}
                                    </span>

                                    {/* Due Date */}
                                    {task.dueDate && (
                                        <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs ${
                                            overdue
                                                ? 'bg-red-500 bg-opacity-20 text-red-400'
                                                : daysUntil <= 1
                                                    ? 'bg-orange-500 bg-opacity-20 text-orange-400'
                                                    : 'bg-white bg-opacity-10 text-gray-300'
                                        }`}>
                                            <i data-lucide="calendar" className="w-3 h-3"></i>
                                            {overdue ? 'באיחור' : daysUntil === 0 ? 'היום' : daysUntil === 1 ? 'מחר' : formatDate(task.dueDate)}
                                        </span>
                                    )}

                                    {/* Subtasks count */}
                                    {subtasksTotal > 0 && (
                                        <button
                                            onClick={() => setExpanded(!expanded)}
                                            className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs bg-white bg-opacity-10 text-gray-300 hover:bg-opacity-20 transition touch-manipulation"
                                        >
                                            <i data-lucide="list-checks" className="w-3 h-3"></i>
                                            {subtasksDone}/{subtasksTotal}
                                            <i data-lucide={expanded ? 'chevron-up' : 'chevron-down'} className="w-3 h-3"></i>
                                        </button>
                                    )}
                                </div>

                                {/* Subtasks List */}
                                {expanded && task.subtasks && task.subtasks.length > 0 && (
                                    <div className="mt-3 space-y-1.5 slide-up">
                                        {task.subtasks.map((subtask, idx) => (
                                            <div key={subtask.id} className="flex items-center gap-2 pr-2">
                                                <button
                                                    onClick={() => onSubtaskToggle(task.id, subtask.id)}
                                                    className={`flex-shrink-0 w-4 h-4 rounded border flex items-center justify-center transition touch-manipulation ${
                                                        subtask.completed
                                                            ? 'bg-green-500 border-green-500 text-white'
                                                            : 'border-gray-600 hover:border-gray-400'
                                                    }`}
                                                >
                                                    {subtask.completed && <i data-lucide="check" className="w-3 h-3"></i>}
                                                </button>
                                                <span className={`text-xs sm:text-sm ${subtask.completed ? 'line-through text-gray-500' : 'text-gray-300'}`}>
                                                    {subtask.title}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ===== ADD/EDIT TASK MODAL =====
        function TaskModal({ task, onSave, onClose }) {
            const [title, setTitle] = useState(task?.title || '');
            const [description, setDescription] = useState(task?.description || '');
            const [priority, setPriority] = useState(task?.priority || 'medium');
            const [category, setCategory] = useState(task?.category || 'work');
            const [dueDate, setDueDate] = useState(task?.dueDate || '');
            const [subtasks, setSubtasks] = useState(task?.subtasks || []);
            const [newSubtask, setNewSubtask] = useState('');
            const titleRef = useRef(null);

            useEffect(() => {
                if (titleRef.current) titleRef.current.focus();
            }, []);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!title.trim()) return;

                onSave({
                    id: task?.id || generateId(),
                    title: title.trim(),
                    description: description.trim(),
                    priority,
                    category,
                    dueDate,
                    subtasks,
                    completed: task?.completed || false,
                    createdAt: task?.createdAt || new Date().toISOString(),
                });
            };

            const addSubtask = () => {
                if (!newSubtask.trim()) return;
                setSubtasks([...subtasks, { id: generateId(), title: newSubtask.trim(), completed: false }]);
                setNewSubtask('');
            };

            const removeSubtask = (id) => {
                setSubtasks(subtasks.filter(s => s.id !== id));
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 fade-in" onClick={onClose}>
                    <div className="absolute inset-0 bg-black bg-opacity-60 backdrop-blur-sm"></div>
                    <div
                        className="relative bg-gray-900 border border-white border-opacity-20 rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto slide-up"
                        onClick={e => e.stopPropagation()}
                    >
                        <div className="sticky top-0 bg-gray-900 border-b border-white border-opacity-10 p-4 flex justify-between items-center rounded-t-2xl z-10">
                            <h2 className="text-lg font-bold text-white">
                                {task ? 'עריכת משימה' : 'משימה חדשה'}
                            </h2>
                            <button onClick={onClose} className="p-2 rounded-lg hover:bg-white hover:bg-opacity-10 text-gray-400 transition touch-manipulation">
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="p-4 space-y-4">
                            {/* Title */}
                            <div>
                                <label className="block text-sm font-medium text-gray-300 mb-1.5">כותרת</label>
                                <input
                                    ref={titleRef}
                                    type="text"
                                    value={title}
                                    onChange={e => setTitle(e.target.value)}
                                    placeholder="מה צריך לעשות?"
                                    required
                                    className="w-full px-4 py-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl text-white placeholder-gray-500 outline-none focus:border-indigo-500 transition text-sm sm:text-base"
                                />
                            </div>

                            {/* Description */}
                            <div>
                                <label className="block text-sm font-medium text-gray-300 mb-1.5">תיאור (אופציונלי)</label>
                                <textarea
                                    value={description}
                                    onChange={e => setDescription(e.target.value)}
                                    placeholder="פרטים נוספים..."
                                    rows="2"
                                    className="w-full px-4 py-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl text-white placeholder-gray-500 outline-none focus:border-indigo-500 transition resize-none text-sm sm:text-base"
                                />
                            </div>

                            {/* Priority & Category */}
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-sm font-medium text-gray-300 mb-1.5">עדיפות</label>
                                    <select
                                        value={priority}
                                        onChange={e => setPriority(e.target.value)}
                                        className="w-full px-4 py-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl text-white outline-none focus:border-indigo-500 transition text-sm sm:text-base"
                                    >
                                        {PRIORITIES.map(p => (
                                            <option key={p.value} value={p.value} className="bg-gray-800">{p.label}</option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-300 mb-1.5">קטגוריה</label>
                                    <select
                                        value={category}
                                        onChange={e => setCategory(e.target.value)}
                                        className="w-full px-4 py-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl text-white outline-none focus:border-indigo-500 transition text-sm sm:text-base"
                                    >
                                        {CATEGORIES.map(c => (
                                            <option key={c.value} value={c.value} className="bg-gray-800">{c.label}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            {/* Due Date */}
                            <div>
                                <label className="block text-sm font-medium text-gray-300 mb-1.5">תאריך יעד</label>
                                <input
                                    type="date"
                                    value={dueDate}
                                    onChange={e => setDueDate(e.target.value)}
                                    className="w-full px-4 py-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl text-white outline-none focus:border-indigo-500 transition text-sm sm:text-base"
                                />
                            </div>

                            {/* Subtasks */}
                            <div>
                                <label className="block text-sm font-medium text-gray-300 mb-1.5">תתי-משימות</label>
                                <div className="flex gap-2 mb-2">
                                    <input
                                        type="text"
                                        value={newSubtask}
                                        onChange={e => setNewSubtask(e.target.value)}
                                        onKeyDown={e => e.key === 'Enter' && (e.preventDefault(), addSubtask())}
                                        placeholder="הוסף תת-משימה..."
                                        className="flex-1 px-4 py-2.5 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl text-white placeholder-gray-500 outline-none focus:border-indigo-500 transition text-sm"
                                    />
                                    <button
                                        type="button"
                                        onClick={addSubtask}
                                        className="px-3 py-2.5 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl transition touch-manipulation"
                                    >
                                        <i data-lucide="plus" className="w-4 h-4"></i>
                                    </button>
                                </div>
                                {subtasks.length > 0 && (
                                    <div className="space-y-1.5">
                                        {subtasks.map(st => (
                                            <div key={st.id} className="flex items-center justify-between gap-2 px-3 py-2 bg-white bg-opacity-5 rounded-lg">
                                                <span className="text-sm text-gray-300">{st.title}</span>
                                                <button
                                                    type="button"
                                                    onClick={() => removeSubtask(st.id)}
                                                    className="p-1 text-gray-500 hover:text-red-400 transition touch-manipulation"
                                                >
                                                    <i data-lucide="x" className="w-3.5 h-3.5"></i>
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Actions */}
                            <div className="flex gap-3 pt-2">
                                <button
                                    type="submit"
                                    className="flex-1 py-3 bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 text-white font-medium rounded-xl transition touch-manipulation"
                                >
                                    {task ? 'שמור שינויים' : 'הוסף משימה'}
                                </button>
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="px-6 py-3 bg-white bg-opacity-10 hover:bg-opacity-20 text-white rounded-xl transition touch-manipulation"
                                >
                                    ביטול
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // ===== TASKS PANEL =====
        function TasksPanel() {
            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem('dashboard_tasks');
                return saved ? JSON.parse(saved) : [
                    {
                        id: generateId(),
                        title: 'לבנות דשבורד ניהול',
                        description: 'בניית לוח בקרה כללי עם ניהול משימות, בוטים וניתוח',
                        priority: 'high',
                        category: 'work',
                        dueDate: '',
                        subtasks: [
                            { id: generateId(), title: 'חלון משימות', completed: true },
                            { id: generateId(), title: 'חלון הרגלים', completed: false },
                            { id: generateId(), title: 'חלון בוטים', completed: false },
                            { id: generateId(), title: 'חלון ניתוח', completed: false },
                        ],
                        completed: false,
                        createdAt: new Date().toISOString(),
                    },
                ];
            });

            const [showModal, setShowModal] = useState(false);
            const [editingTask, setEditingTask] = useState(null);
            const [filter, setFilter] = useState('all'); // all, active, completed
            const [sortBy, setSortBy] = useState('priority'); // priority, date, created
            const [searchQuery, setSearchQuery] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('all');

            useEffect(() => {
                localStorage.setItem('dashboard_tasks', JSON.stringify(tasks));
            }, [tasks]);

            const toggleTask = (id) => {
                setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
            };

            const toggleSubtask = (taskId, subtaskId) => {
                setTasks(tasks.map(t => {
                    if (t.id !== taskId) return t;
                    const newSubtasks = t.subtasks.map(s =>
                        s.id === subtaskId ? { ...s, completed: !s.completed } : s
                    );
                    return { ...t, subtasks: newSubtasks };
                }));
            };

            const saveTask = (taskData) => {
                if (editingTask) {
                    setTasks(tasks.map(t => t.id === taskData.id ? taskData : t));
                } else {
                    setTasks([taskData, ...tasks]);
                }
                setShowModal(false);
                setEditingTask(null);
            };

            const deleteTask = (id) => {
                if (confirm('למחוק את המשימה?')) {
                    setTasks(tasks.filter(t => t.id !== id));
                }
            };

            const editTask = (task) => {
                setEditingTask(task);
                setShowModal(true);
            };

            // Filter & Sort
            const priorityOrder = { urgent: 0, high: 1, medium: 2, low: 3 };

            const filteredTasks = useMemo(() => {
                let result = [...tasks];

                // Status filter
                if (filter === 'active') result = result.filter(t => !t.completed);
                if (filter === 'completed') result = result.filter(t => t.completed);

                // Category filter
                if (categoryFilter !== 'all') result = result.filter(t => t.category === categoryFilter);

                // Search
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    result = result.filter(t =>
                        t.title.toLowerCase().includes(q) ||
                        (t.description && t.description.toLowerCase().includes(q))
                    );
                }

                // Sort
                result.sort((a, b) => {
                    if (a.completed !== b.completed) return a.completed ? 1 : -1;
                    if (sortBy === 'priority') return priorityOrder[a.priority] - priorityOrder[b.priority];
                    if (sortBy === 'date') {
                        if (!a.dueDate) return 1;
                        if (!b.dueDate) return -1;
                        return new Date(a.dueDate) - new Date(b.dueDate);
                    }
                    return new Date(b.createdAt) - new Date(a.createdAt);
                });

                return result;
            }, [tasks, filter, sortBy, searchQuery, categoryFilter]);

        // ===== HABITS PANEL (from existing code) =====
        function HabitsPanel() {
            const today = new Date().toISOString().split('T')[0];

            const [habits, setHabits] = useState(() => {
                const saved = localStorage.getItem('habits');
                return saved ? JSON.parse(saved) : [
                    { id: 1, name: 'התעוררות מוקדמת (6:00)', xp: 20, color: 'bg-orange-500', category: 'בריאות' },
                    { id: 2, name: 'אימון גופני 30 דק׳', xp: 30, color: 'bg-red-500', category: 'בריאות' },
                    { id: 3, name: 'קריאה 20 דק׳', xp: 20, color: 'bg-blue-500', category: 'פרודוקטיביות' },
                    { id: 4, name: 'מדיטציה 10 דק׳', xp: 15, color: 'bg-purple-500', category: 'בריאות' },
                    { id: 5, name: 'תכנון יומי', xp: 15, color: 'bg-green-500', category: 'פרודוקטיביות' },
                ];
            });

            const [completedHabits, setCompletedHabits] = useState(() => {
                const saved = localStorage.getItem('habitData');
                return saved ? JSON.parse(saved) : {};
            });

            const [editMode, setEditMode] = useState(false);
            const [editingHabit, setEditingHabit] = useState(null);
            const [showCelebration, setShowCelebration] = useState(false);
            const [celebrationMessage, setCelebrationMessage] = useState('');
            const [showAddForm, setShowAddForm] = useState(false);

            useEffect(() => {
                localStorage.setItem('habitData', JSON.stringify(completedHabits));
            }, [completedHabits]);

            useEffect(() => {
                localStorage.setItem('habits', JSON.stringify(habits));
            }, [habits]);

            const toggleHabit = (habitId) => {
                const newCompleted = { ...completedHabits };
                if (!newCompleted[today]) newCompleted[today] = [];

                if (newCompleted[today].includes(habitId)) {
                    newCompleted[today] = newCompleted[today].filter(id => id !== habitId);
                } else {
                    newCompleted[today] = [...newCompleted[today], habitId];
                    if (newCompleted[today].length === habits.length) {
                        setCelebrationMessage('יום מושלם! כל ההרגלים הושלמו!');
                        setShowCelebration(true);
                        setTimeout(() => setShowCelebration(false), 3000);
                    }
                }
                setCompletedHabits(newCompleted);
            };

            const getDailyXP = (date) => {
                const completed = completedHabits[date] || [];
                return completed.reduce((sum, habitId) => {
                    const habit = habits.find(h => h.id === habitId);
                    return sum + (habit ? habit.xp : 0);
                }, 0);
            };

            const maxDailyXP = habits.reduce((sum, h) => sum + h.xp, 0);
            const todayXP = getDailyXP(today);
            const todayProgress = maxDailyXP > 0 ? (todayXP / maxDailyXP) * 100 : 0;

            const calculateStreak = () => {
                let streak = 0;
                let currentDate = new Date();
                while (true) {
                    const dateStr = currentDate.toISOString().split('T')[0];
                    const completed = completedHabits[dateStr] || [];
                    if (completed.length === habits.length) {
                        streak++;
                        currentDate.setDate(currentDate.getDate() - 1);
                    } else if (dateStr === today && completed.length > 0) {
                        currentDate.setDate(currentDate.getDate() - 1);
                    } else {
                        break;
                    }
                }
                return streak;
            };

            const getWeeklyXP = () => {
                const now = new Date();
                const dayOfWeek = now.getDay();
                const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
                const monday = new Date(now);
                monday.setDate(now.getDate() + mondayOffset);
                let weekXP = 0;
                for (let i = 0; i < 7; i++) {
                    const date = new Date(monday);
                    date.setDate(monday.getDate() + i);
                    weekXP += getDailyXP(date.toISOString().split('T')[0]);
                }
                return weekXP;
            };

            const streak = calculateStreak();
            const weeklyXP = getWeeklyXP();

            const addHabit = (habitData) => {
                const newHabit = {
                    id: Date.now(),
                    name: habitData.name || 'הרגל חדש',
                    xp: habitData.xp || 10,
                    color: habitData.color || 'bg-gray-500',
                    category: habitData.category || 'כללי'
                };
                setHabits([...habits, newHabit]);
                setShowAddForm(false);

            const updateHabit = (id, field, value) => {
                setHabits(habits.map(h => h.id === id ? { ...h, [field]: value } : h));
            };

            const deleteHabit = (id) => {
                if (confirm('האם אתה בטוח שברצונך למחוק את ההרגל?')) {

                { value: 'bg-green-500', label: 'ירוק' },
                { value: 'bg-blue-500', label: 'כחול' },
                { value: 'bg-indigo-500', label: 'אינדיגו' },
                { value: 'bg-purple-500', label: 'סגול' },

                            </div>

                            </div>

                        <div className="bg-white bg-opacity-5 backdrop-blur rounded-xl p-3 sm:p-4 border border-white border-opacity-10">

                                <span className="text-gray-400 text-xs">סטריק</span>
                            </div>

                                <i data-lucide="calendar" className="w-4 h-4 text-green-400"></i>
                                <span className="text-gray-400 text-xs">שבועי</span>
                            </div>
                            <div className="text-xl sm:text-2xl font-bold text-white">{weeklyXP}</div>
                            <div className="text-green-300 text-xs mt-1">XP</div>
                        </div>
                    </div>

                    {/* Habits List */}
                    <div className="bg-white bg-opacity-5 backdrop-blur rounded-xl p-4 sm:p-6 border border-white border-opacity-10">

                            בפיתוח
                        </div>
                    </div>
                </div>
            );
        }

        // ===== ANALYTICS PANEL (placeholder) =====
        function AnalyticsPanel() {
            return (
                <div className="fade-in">
                    <div className="text-center py-20">
                        <div className="w-20 h-20 bg-green-500 bg-opacity-20 rounded-2xl flex items-center justify-center mx-auto mb-6">
                            <i data-lucide="bar-chart-3" className="w-10 h-10 text-green-400"></i>
                        </div>
                        <h2 className="text-2xl font-bold text-white mb-3">ניתוח ודוחות</h2>
                        <p className="text-gray-400 max-w-md mx-auto">בקרוב: גרפים, סטטיסטיקות, מעקב ביצועים, וניתוח מגמות.</p>
                        <div className="mt-8 inline-flex items-center gap-2 px-6 py-3 bg-green-500 bg-opacity-10 border border-green-500 border-opacity-30 rounded-xl text-green-300">
                            <i data-lucide="construction" className="w-5 h-5"></i>
                            בפיתוח
                        </div>
                    </div>
                </div>
            );
        }

        // ===== SETTINGS PANEL (placeholder) =====
        function SettingsPanel() {
            return (
                <div className="fade-in">
                    <div className="text-center py-20">
                        <div className="w-20 h-20 bg-gray-500 bg-opacity-20 rounded-2xl flex items-center justify-center mx-auto mb-6">
                            <i data-lucide="settings" className="w-10 h-10 text-gray-400"></i>
                        </div>
                        <h2 className="text-2xl font-bold text-white mb-3">הגדרות</h2>
                        <p className="text-gray-400 max-w-md mx-auto">בקרוב: ניהול הגדרות, ייצוא/ייבוא נתונים, ועוד.</p>
                        <div className="mt-8 inline-flex items-center gap-2 px-6 py-3 bg-gray-500 bg-opacity-10 border border-gray-500 border-opacity-30 rounded-xl text-gray-300">
                            <i data-lucide="construction" className="w-5 h-5"></i>
                            בפיתוח
                        </div>
                    </div>
                </div>
            );
        }

        // ===== MAIN DASHBOARD =====
        function Dashboard() {
            const [activePanel, setActivePanel] = useState(() => {
                return localStorage.getItem('dashboard_activePanel') || 'tasks';
            });
            const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

            useEffect(() => {
                localStorage.setItem('dashboard_activePanel', activePanel);
            }, [activePanel]);

            const renderPanel = () => {
                switch (activePanel) {
                    case 'tasks': return <TasksPanel />;
                    case 'habits': return <HabitsPanel />;
                    case 'bots': return <BotsPanel />;
                    case 'analytics': return <AnalyticsPanel />;
                    case 'settings': return <SettingsPanel />;
                    default: return <TasksPanel />;
                }
            };

            const activeNav = NAV_ITEMS.find(n => n.id === activePanel);

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950 flex">
                    {/* Desktop Sidebar */}
                    <aside className={`sidebar-desktop fixed right-0 top-0 h-full z-30 transition-all duration-300 ${
                        sidebarCollapsed ? 'w-16' : 'w-56'
                    } bg-black bg-opacity-40 backdrop-blur-xl border-l border-white border-opacity-10`}>
                        {/* Logo */}
                        <div className="p-4 border-b border-white border-opacity-10">
                            <div className="flex items-center gap-3">
                                <div className="flex-shrink-0 w-9 h-9 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center">
                                    <i data-lucide="layout-dashboard" className="w-5 h-5 text-white"></i>
                                </div>
                                {!sidebarCollapsed && (
                                    <div>
                                        <h1 className="text-white font-bold text-sm">לוח בקרה</h1>
                                        <p className="text-gray-500 text-xs">מרכז הניהול שלי</p>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Nav Items */}
                        <nav className="p-2 space-y-1 mt-2">
                            {NAV_ITEMS.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setActivePanel(item.id)}
                                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all touch-manipulation ${
                                        activePanel === item.id
                                            ? 'nav-item-active text-white'
                                            : 'text-gray-400 hover:text-white hover:bg-white hover:bg-opacity-5'
                                    }`}
                                >
                                    <i data-lucide={item.icon} className={`w-5 h-5 flex-shrink-0 ${activePanel === item.id ? item.color : ''}`}></i>
                                    {!sidebarCollapsed && <span className="text-sm font-medium">{item.label}</span>}
                                </button>
                            ))}
                        </nav>

                        {/* Collapse Toggle */}
                        <div className="absolute bottom-4 left-0 right-0 px-2">
                            <button
                                onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                                className="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-xl text-gray-500 hover:text-white hover:bg-white hover:bg-opacity-5 transition touch-manipulation"
                            >
                                <i data-lucide={sidebarCollapsed ? 'chevron-left' : 'chevron-right'} className="w-4 h-4"></i>
                                {!sidebarCollapsed && <span className="text-xs">כווץ תפריט</span>}
                            </button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className={`flex-1 transition-all duration-300 ${
                        sidebarCollapsed ? 'md:mr-16' : 'md:mr-56'
                    }`}>
                        {/* Top Bar */}
                        <header className="sticky top-0 z-20 bg-gray-950 bg-opacity-80 backdrop-blur-xl border-b border-white border-opacity-10">
                            <div className="px-4 sm:px-6 py-3 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    {activeNav && <i data-lucide={activeNav.icon} className={`w-5 h-5 ${activeNav.color}`}></i>}
                                    <h2 className="text-lg font-bold text-white">{activeNav?.label || 'לוח בקרה'}</h2>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="text-xs text-gray-500 hidden sm:block">
                                        {new Date().toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
                                    </div>
                                </div>
                            </div>
                        </header>

                        {/* Content */}
                        <div className="p-4 sm:p-6 pb-24 md:pb-6">
                            {renderPanel()}
                        </div>
                    </main>

                    {/* Mobile Bottom Navigation */}
                    <nav className="mobile-bottom-nav fixed bottom-0 left-0 right-0 z-30 bg-gray-950 bg-opacity-95 backdrop-blur-xl border-t border-white border-opacity-10">
                        <div className="flex justify-around items-center py-2 px-2">
                            {NAV_ITEMS.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setActivePanel(item.id)}
                                    className={`flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl transition-all touch-manipulation ${
                                        activePanel === item.id
                                            ? 'text-white'
                                            : 'text-gray-500'
                                    }`}
                                >
                                    <i data-lucide={item.icon} className={`w-5 h-5 ${activePanel === item.id ? item.color : ''}`}></i>
                                    <span className="text-[10px] font-medium">{item.label}</span>
                                    {activePanel === item.id && (
                                        <div className={`w-1 h-1 rounded-full mt-0.5 ${item.color.replace('text-', 'bg-')}`}></div>
                                    )}
                                </button>
                            ))}
                        </div>
                    </nav>
                </div>
            );
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);

        // Initialize Lucide icons
        lucide.createIcons();
        const observer = new MutationObserver(() => {
            lucide.createIcons();
        });
        observer.observe(document.getElementById('root'), {
            childList: true,
            subtree: true
        });
    </script>
</body>
</html>
