    <script>
        // Check if critical scripts loaded
        window.addEventListener('load', function() {
            setTimeout(function() {
                var root = document.getElementById('root');
                var loadScreen = document.getElementById('loading-screen');
                if (loadScreen && root.children.length <= 1) {
                    var err = document.getElementById('load-error');
                    var missing = [];
                    if (typeof React === 'undefined') missing.push('React');
                    if (typeof ReactDOM === 'undefined') missing.push('ReactDOM');
                    if (typeof Babel === 'undefined') missing.push('Babel');
                    if (typeof lucide === 'undefined') missing.push('Lucide Icons');
                    if (missing.length > 0) {
                        err.textContent = 'Scripts blocked: ' + missing.join(', ') + '. Try disabling AdBlock for this site.';
                    } else {
                        err.textContent = 'Check browser console (F12) for errors.';
                    }
                    err.style.display = 'block';
                }
            }, 5000);
        });

        // =============================================

        const FIREBASE_CONFIG = {
            apiKey: "",
            authDomain: "",
            projectId: "",
            storageBucket: "",
            messagingSenderId: "",
            appId: ""
        };

        // Initialize Firebase (only if configured)
        let db = null;
        let auth = null;
        let firebaseReady = false;

        if (FIREBASE_CONFIG.apiKey) {
            try {
                const app = firebase.initializeApp(FIREBASE_CONFIG);
                db = firebase.firestore();

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React;

        // ===== AUTH CONTEXT =====
        const AuthContext = createContext(null);

        function useAuth() {
            return useContext(AuthContext);
        }

        function AuthProvider({ children }) {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [syncing, setSyncing] = useState(false);

            useEffect(() => {
                if (!firebaseReady) {
                    setLoading(false);
                    return;
                }

                const unsubscribe = auth.onAuthStateChanged((firebaseUser) => {
                    setUser(firebaseUser);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, []);

            const signInWithEmail = async (email, password) => {
                if (!firebaseReady) return { error: 'Firebase לא מוגדר' };
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                    return { error: null };
                } catch (e) {
                    const messages = {
                        'auth/user-not-found': 'משתמש לא נמצא',
                        'auth/wrong-password': 'סיסמה שגויה',
                        'auth/invalid-email': 'אימייל לא תקין',
                        'auth/too-many-requests': 'יותר מדי ניסיונות, נסה שוב מאוחר יותר',
                        'auth/invalid-credential': 'אימייל או סיסמה שגויים',
                    };
                    return { error: messages[e.code] || e.message };
                }
            };

            const signUpWithEmail = async (email, password) => {
                if (!firebaseReady) return { error: 'Firebase לא מוגדר' };
                try {
                    await auth.createUserWithEmailAndPassword(email, password);
                    return { error: null };
                } catch (e) {
                    const messages = {
                        'auth/email-already-in-use': 'האימייל הזה כבר רשום',
                        'auth/invalid-email': 'אימייל לא תקין',
                        'auth/weak-password': 'הסיסמה חייבת להיות לפחות 6 תווים',
                    };
                    return { error: messages[e.code] || e.message };
                }
            };

            const signOut = async () => {
                if (!firebaseReady) return;
                await auth.signOut();
            };

            return (
                <AuthContext.Provider value={{ user, loading, syncing, setSyncing, signInWithEmail, signUpWithEmail, signOut, firebaseReady }}>
                    {children}
                </AuthContext.Provider>
            );
        }

        // ===== FIRESTORE SYNC HOOK =====
        function useFirestoreSync(collectionName, localStorageKey, defaultValue) {
            const { user, firebaseReady, setSyncing } = useAuth();

            const [data, setData] = useState(() => {
                const saved = localStorage.getItem(localStorageKey);
                return saved ? JSON.parse(saved) : defaultValue;
            });

            const isFirstLoad = useRef(true);
            const unsubRef = useRef(null);

            // Save to localStorage always
            useEffect(() => {
                localStorage.setItem(localStorageKey, JSON.stringify(data));
            }, [data, localStorageKey]);

            // Subscribe to Firestore when logged in
            useEffect(() => {
                if (!firebaseReady || !user || !db) return;

                const docRef = db.collection('users').doc(user.uid).collection('data').doc(collectionName);

                unsubRef.current = docRef.onSnapshot((snap) => {
                    if (snap.exists) {
                        const remoteData = snap.data().value;
                        if (isFirstLoad.current) {
                            // On first load, merge: prefer remote if it has data
                            if (remoteData && (Array.isArray(remoteData) ? remoteData.length > 0 : Object.keys(remoteData).length > 0)) {
                                setData(remoteData);
                            } else {
                                // Remote is empty, push local data up
                                docRef.set({ value: data, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
                            }
                            isFirstLoad.current = false;
                        } else {
                            setData(remoteData);
                        }
                    } else if (isFirstLoad.current) {
                        // No remote doc, push local data
                        docRef.set({ value: data, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
                        isFirstLoad.current = false;
                    }
                }, (err) => {
                    console.error('Firestore listen error:', err);
                });

                return () => {
                    if (unsubRef.current) unsubRef.current();
                    isFirstLoad.current = true;
                };
            }, [user, firebaseReady, collectionName]);

            // Write to Firestore on data change (debounced)
            const timeoutRef = useRef(null);

            const setDataAndSync = useCallback((newDataOrFn) => {
                setData((prev) => {
                    const newData = typeof newDataOrFn === 'function' ? newDataOrFn(prev) : newDataOrFn;

                    // Debounced sync to Firestore
                    if (firebaseReady && user && db && !isFirstLoad.current) {
                        if (timeoutRef.current) clearTimeout(timeoutRef.current);
                        timeoutRef.current = setTimeout(() => {
                            setSyncing(true);
                            const docRef = db.collection('users').doc(user.uid).collection('data').doc(collectionName);
                            docRef.set({
                                value: newData,
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            }).then(() => {
                                setTimeout(() => setSyncing(false), 500);
                            }).catch(() => setSyncing(false));
                        }, 800);
                    }

                    return newData;
                });
            }, [user, firebaseReady, collectionName, setSyncing]);

            return [data, setDataAndSync];
        }

        // ===== UTILITY FUNCTIONS =====
        const generateId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);

            today.setHours(0, 0, 0, 0);

            target.setHours(0, 0, 0, 0);

        function LoginScreen() {
            const { signInWithEmail, signUpWithEmail } = useAuth();

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');

                if (isRegister && password !== confirmPassword) {
                    setError('הסיסמאות לא תואמות');
                    return;
                }
                if (password.length < 6) {
                    setError('הסיסמה חייבת להיות לפחות 6 תווים');
                    return;
                }

                setSubmitting(true);
                const result = isRegister
                    ? await signUpWithEmail(email, password)
                    : await signInWithEmail(email, password);
                setSubmitting(false);

                if (result.error) {
                    setError(result.error);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950 flex items-center justify-center p-4">
                    <div className="max-w-sm w-full">
                        <div className="text-center mb-8">
                            <div className="w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-6">
                                <i data-lucide="layout-dashboard" className="w-10 h-10 text-white"></i>
                            </div>
                            <h1 className="text-3xl font-bold text-white mb-2">לוח בקרה</h1>
                            <p className="text-gray-400">{isRegister ? 'צור חשבון חדש' : 'התחבר כדי לסנכרן בין המכשירים שלך'}</p>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-300 mb-1.5">אימייל</label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={e => setEmail(e.target.value)}
                                    placeholder="your@email.com"
                                    required
                                    dir="ltr"
                                    className="w-full px-4 py-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl text-white placeholder-gray-500 outline-none focus:border-indigo-500 transition text-sm"
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-300 mb-1.5">סיסמה</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={e => setPassword(e.target.value)}
                                    placeholder="••••••••"
                                    required
                                    dir="ltr"
                                    className="w-full px-4 py-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl text-white placeholder-gray-500 outline-none focus:border-indigo-500 transition text-sm"
                                />
                            </div>

                            {isRegister && (
                                <div className="slide-up">
                                    <label className="block text-sm font-medium text-gray-300 mb-1.5">אימות סיסמה</label>
                                    <input
                                        type="password"
                                        value={confirmPassword}
                                        onChange={e => setConfirmPassword(e.target.value)}
                                        placeholder="••••••••"
                                        required
                                        dir="ltr"
                                        className="w-full px-4 py-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl text-white placeholder-gray-500 outline-none focus:border-indigo-500 transition text-sm"
                                    />
                                </div>
                            )}

                            {error && (
                                <div className="p-3 bg-red-500 bg-opacity-10 border border-red-500 border-opacity-30 rounded-xl text-red-400 text-sm text-center slide-up">
                                    {error}
                                </div>
                            )}

                            <button
                                type="submit"
                                disabled={submitting}
                                className="w-full py-3.5 bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 disabled:opacity-50 text-white font-medium rounded-xl transition shadow-lg touch-manipulation flex items-center justify-center gap-2"
                            >
                                {submitting ? (
                                    <><i data-lucide="loader-2" className="w-4 h-4 spin-slow"></i><span>מתחבר...</span></>
                                ) : isRegister ? 'צור חשבון' : 'התחבר'}
                            </button>
                        </form>

                        <div className="mt-6 text-center">
                            <button
                                onClick={() => { setIsRegister(!isRegister); setError(''); setConfirmPassword(''); }}
                                className="text-indigo-400 hover:text-indigo-300 text-sm transition touch-manipulation"
                            >
                                {isRegister ? 'יש לך חשבון? התחבר' : 'אין לך חשבון? צור חדש'}
                            </button>
                        </div>

                        <p className="text-gray-600 text-xs mt-4 text-center">הנתונים שלך מאוחסנים בצורה מאובטחת ונגישים רק לך</p>
                    </div>
                </div>
            );
        }

        // ===== SYNC INDICATOR =====
        function SyncIndicator() {
            const { user, syncing, firebaseReady } = useAuth();

            if (!firebaseReady) return null;

            return (
                <div className="flex items-center gap-1.5">
                    {syncing ? (
                        <div className="flex items-center gap-1.5 text-yellow-400">
                            <i data-lucide="loader-2" className="w-3.5 h-3.5 spin-slow"></i>
                            <span className="text-xs hidden sm:inline">מסנכרן...</span>

                    ) : user ? (

        // ===== TASK ITEM COMPONENT =====
        function TaskItem({ task, onToggle, onEdit, onDelete, onSubtaskToggle }) {
            const [expanded, setExpanded] = useState(false);
            const priority = PRIORITIES.find(p => p.value === task.priority) || PRIORITIES[2];
            const category = CATEGORIES.find(c => c.value === task.category) || CATEGORIES[7];
            const daysUntil = getDaysUntil(task.dueDate);
            const overdue = isOverdue(task.dueDate) && !task.completed;
            const subtasksDone = task.subtasks ? task.subtasks.filter(s => s.completed).length : 0;
            const subtasksTotal = task.subtasks ? task.subtasks.length : 0;

            return (
                <div className={`group rounded-xl border-r-4 transition-all duration-200 ${
                    task.completed
                        ? 'bg-white bg-opacity-5 border-green-500 opacity-60'
                        : overdue
                            ? 'bg-red-500 bg-opacity-5 border-red-500'
                            : `bg-white bg-opacity-5 ${priority.borderColor}`
                } hover:bg-opacity-10`}>
                    <div className="p-3 sm:p-4">
                        <div className="flex items-start gap-3">
                            <button
                                onClick={() => onToggle(task.id)}
                                className={`task-checkbox flex-shrink-0 w-6 h-6 mt-0.5 rounded-lg border-2 flex items-center justify-center transition-all touch-manipulation ${
                                    task.completed
                                        ? 'bg-green-500 border-green-500 text-white checked'
                                        : 'border-gray-500 hover:border-gray-300'
                                }`}
                            >
                                {task.completed && <i data-lucide="check" className="w-4 h-4"></i>}
                            </button>

                            <div className="flex-1 min-w-0">
                                <div className="flex items-start justify-between gap-2">
                                    <h3 className={`font-medium text-sm sm:text-base ${
                                        task.completed ? 'line-through text-gray-500' : 'text-white'
                                    }`}>
                                        {task.title}
                                    </h3>
                                    <div className="flex items-center gap-1 flex-shrink-0">
                                        <button
                                            onClick={() => onEdit(task)}
                                            className="opacity-0 group-hover:opacity-100 p-1.5 rounded-lg hover:bg-white hover:bg-opacity-10 text-gray-400 hover:text-white transition touch-manipulation"
                                        >
                                            <i data-lucide="edit-2" className="w-3.5 h-3.5"></i>
                                        </button>
                                        <button
                                            onClick={() => onDelete(task.id)}
                                            className="opacity-0 group-hover:opacity-100 p-1.5 rounded-lg hover:bg-red-500 hover:bg-opacity-20 text-gray-400 hover:text-red-400 transition touch-manipulation"
                                        >
                                            <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                        </button>
                                    </div>
                                </div>

                                {task.description && (
                                    <p className="text-gray-400 text-xs sm:text-sm mt-1 line-clamp-2">{task.description}</p>
                                )}

                                <div className="flex flex-wrap items-center gap-2 mt-2">
                                    <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs ${priority.color} bg-opacity-20 ${priority.textColor}`}>
                                        <span className={`w-1.5 h-1.5 rounded-full ${priority.color}`}></span>
                                        {priority.label}
                                    </span>

                                    <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs bg-white bg-opacity-10 ${category.color}`}>
                                        <i data-lucide={category.icon} className="w-3 h-3"></i>
                                        {category.label}
                                    </span>

                                    {task.dueDate && (
                                        <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs ${
                                            overdue
                                                ? 'bg-red-500 bg-opacity-20 text-red-400'
                                                : daysUntil <= 1
                                                    ? 'bg-orange-500 bg-opacity-20 text-orange-400'
                                                    : 'bg-white bg-opacity-10 text-gray-300'
                                        }`}>
                                            <i data-lucide="calendar" className="w-3 h-3"></i>
                                            {overdue ? 'באיחור' : daysUntil === 0 ? 'היום' : daysUntil === 1 ? 'מחר' : formatDate(task.dueDate)}
                                        </span>
                                    )}

                                    {subtasksTotal > 0 && (
                                        <button
                                            onClick={() => setExpanded(!expanded)}
                                            className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs bg-white bg-opacity-10 text-gray-300 hover:bg-opacity-20 transition touch-manipulation"
                                        >
                                            <i data-lucide="list-checks" className="w-3 h-3"></i>
                                            {subtasksDone}/{subtasksTotal}
                                            <i data-lucide={expanded ? 'chevron-up' : 'chevron-down'} className="w-3 h-3"></i>
                                        </button>
                                    )}
                                </div>

                                {expanded && task.subtasks && task.subtasks.length > 0 && (
                                    <div className="mt-3 space-y-1.5 slide-up">
                                        {task.subtasks.map((subtask) => (
                                            <div key={subtask.id} className="flex items-center gap-2 pr-2">
                                                <button
                                                    onClick={() => onSubtaskToggle(task.id, subtask.id)}
                                                    className={`flex-shrink-0 w-4 h-4 rounded border flex items-center justify-center transition touch-manipulation ${
                                                        subtask.completed
                                                            ? 'bg-green-500 border-green-500 text-white'
                                                            : 'border-gray-600 hover:border-gray-400'
                                                    }`}
                                                >
                                                    {subtask.completed && <i data-lucide="check" className="w-3 h-3"></i>}
                                                </button>
                                                <span className={`text-xs sm:text-sm ${subtask.completed ? 'line-through text-gray-500' : 'text-gray-300'}`}>
                                                    {subtask.title}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ===== ADD/EDIT TASK MODAL =====
        function TaskModal({ task, onSave, onClose }) {
            const [title, setTitle] = useState(task?.title || '');
            const [description, setDescription] = useState(task?.description || '');
            const [priority, setPriority] = useState(task?.priority || 'medium');
            const [category, setCategory] = useState(task?.category || 'work');
            const [dueDate, setDueDate] = useState(task?.dueDate || '');
            const [subtasks, setSubtasks] = useState(task?.subtasks || []);
            const [newSubtask, setNewSubtask] = useState('');
            const titleRef = useRef(null);

            useEffect(() => {
                if (titleRef.current) titleRef.current.focus();
            }, []);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!title.trim()) return;
                onSave({
                    id: task?.id || generateId(),
                    title: title.trim(),
                    description: description.trim(),
                    priority,
                    category,
                    dueDate,
                    subtasks,
                    completed: task?.completed || false,
                    createdAt: task?.createdAt || new Date().toISOString(),
                });
            };

            const addSubtask = () => {
                if (!newSubtask.trim()) return;
                setSubtasks([...subtasks, { id: generateId(), title: newSubtask.trim(), completed: false }]);
                setNewSubtask('');
            };

            const removeSubtask = (id) => {
                setSubtasks(subtasks.filter(s => s.id !== id));
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 fade-in" onClick={onClose}>
                    <div className="absolute inset-0 bg-black bg-opacity-60 backdrop-blur-sm"></div>
                    <div className="relative bg-gray-900 border border-white border-opacity-20 rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto slide-up" onClick={e => e.stopPropagation()}>
                        <div className="sticky top-0 bg-gray-900 border-b border-white border-opacity-10 p-4 flex justify-between items-center rounded-t-2xl z-10">
                            <h2 className="text-lg font-bold text-white">{task ? 'עריכת משימה' : 'משימה חדשה'}</h2>
                            <button onClick={onClose} className="p-2 rounded-lg hover:bg-white hover:bg-opacity-10 text-gray-400 transition touch-manipulation">
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-4 space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-300 mb-1.5">כותרת</label>
                                <input ref={titleRef} type="text" value={title} onChange={e => setTitle(e.target.value)} placeholder="מה צריך לעשות?" required className="w-full px-4 py-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl text-white placeholder-gray-500 outline-none focus:border-indigo-500 transition text-sm sm:text-base" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-300 mb-1.5">תיאור (אופציונלי)</label>
                                <textarea value={description} onChange={e => setDescription(e.target.value)} placeholder="פרטים נוספים..." rows="2" className="w-full px-4 py-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl text-white placeholder-gray-500 outline-none focus:border-indigo-500 transition resize-none text-sm sm:text-base" />
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-sm font-medium text-gray-300 mb-1.5">עדיפות</label>
                                    <select value={priority} onChange={e => setPriority(e.target.value)} className="w-full px-4 py-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl text-white outline-none focus:border-indigo-500 transition text-sm sm:text-base">
                                        {PRIORITIES.map(p => (<option key={p.value} value={p.value} className="bg-gray-800">{p.label}</option>))}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-300 mb-1.5">קטגוריה</label>
                                    <select value={category} onChange={e => setCategory(e.target.value)} className="w-full px-4 py-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl text-white outline-none focus:border-indigo-500 transition text-sm sm:text-base">
                                        {CATEGORIES.map(c => (<option key={c.value} value={c.value} className="bg-gray-800">{c.label}</option>))}
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-300 mb-1.5">תאריך יעד</label>
                                <input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} className="w-full px-4 py-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl text-white outline-none focus:border-indigo-500 transition text-sm sm:text-base" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-300 mb-1.5">תתי-משימות</label>
                                <div className="flex gap-2 mb-2">
                                    <input type="text" value={newSubtask} onChange={e => setNewSubtask(e.target.value)} onKeyDown={e => e.key === 'Enter' && (e.preventDefault(), addSubtask())} placeholder="הוסף תת-משימה..." className="flex-1 px-4 py-2.5 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl text-white placeholder-gray-500 outline-none focus:border-indigo-500 transition text-sm" />
                                    <button type="button" onClick={addSubtask} className="px-3 py-2.5 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl transition touch-manipulation">
                                        <i data-lucide="plus" className="w-4 h-4"></i>
                                    </button>
                                </div>
                                {subtasks.length > 0 && (
                                    <div className="space-y-1.5">

                                            <div key={st.id} className="flex items-center justify-between gap-2 px-3 py-2 bg-white bg-opacity-5 rounded-lg">
                                                <span className="text-sm text-gray-300">{st.title}</span>
                                                <button type="button" onClick={() => removeSubtask(st.id)} className="p-1 text-gray-500 hover:text-red-400 transition touch-manipulation">
                                                    <i data-lucide="x" className="w-3.5 h-3.5"></i>

                                    {task ? 'שמור שינויים' : 'הוסף משימה'}
                                </button>
                                <button type="button" onClick={onClose} className="px-6 py-3 bg-white bg-opacity-10 hover:bg-opacity-20 text-white rounded-xl transition touch-manipulation">ביטול</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // ===== TASKS PANEL =====
        function TasksPanel() {
            const defaultTasks = [
                {
                    id: generateId(),
                    title: 'לבנות דשבורד ניהול',
                    description: 'בניית לוח בקרה כללי עם ניהול משימות, בוטים וניתוח',
                    priority: 'high',
                    category: 'work',
                    dueDate: '',
                    subtasks: [
                        { id: generateId(), title: 'חלון משימות', completed: true },
                        { id: generateId(), title: 'חלון הרגלים', completed: false },
                        { id: generateId(), title: 'חלון בוטים', completed: false },
                        { id: generateId(), title: 'חלון ניתוח', completed: false },
                    ],
                    completed: false,
                    createdAt: new Date().toISOString(),
                },
            ];

            const [tasks, setTasks] = useFirestoreSync('tasks', 'dashboard_tasks', defaultTasks);

            const [showModal, setShowModal] = useState(false);
            const [editingTask, setEditingTask] = useState(null);
            const [filter, setFilter] = useState('all');
            const [sortBy, setSortBy] = useState('priority');
            const [searchQuery, setSearchQuery] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('all');

            const toggleTask = (id) => {
                setTasks(prev => prev.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
            };

            const toggleSubtask = (taskId, subtaskId) => {
                setTasks(prev => prev.map(t => {
                    if (t.id !== taskId) return t;
                    const newSubtasks = t.subtasks.map(s => s.id === subtaskId ? { ...s, completed: !s.completed } : s);
                    return { ...t, subtasks: newSubtasks };
                }));
            };

            const saveTask = (taskData) => {
                if (editingTask) {
                    setTasks(prev => prev.map(t => t.id === taskData.id ? taskData : t));
                } else {
                    setTasks(prev => [taskData, ...prev]);
                }
                setShowModal(false);
                setEditingTask(null);
            };

            const deleteTask = (id) => {
                if (confirm('למחוק את המשימה?')) {
                    setTasks(prev => prev.filter(t => t.id !== id));
                }
            };

            const editTask = (task) => {
                setEditingTask(task);
                setShowModal(true);
            };

            const priorityOrder = { urgent: 0, high: 1, medium: 2, low: 3 };

            const filteredTasks = useMemo(() => {
                let result = [...tasks];
                if (filter === 'active') result = result.filter(t => !t.completed);
                if (filter === 'completed') result = result.filter(t => t.completed);
                if (categoryFilter !== 'all') result = result.filter(t => t.category === categoryFilter);
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    result = result.filter(t => t.title.toLowerCase().includes(q) || (t.description && t.description.toLowerCase().includes(q)));
                }
                result.sort((a, b) => {
                    if (a.completed !== b.completed) return a.completed ? 1 : -1;
                    if (sortBy === 'priority') return priorityOrder[a.priority] - priorityOrder[b.priority];
                    if (sortBy === 'date') {
                        if (!a.dueDate) return 1;
                        if (!b.dueDate) return -1;
                        return new Date(a.dueDate) - new Date(b.dueDate);
                    }
                    return new Date(b.createdAt) - new Date(a.createdAt);
                });
                return result;
            }, [tasks, filter, sortBy, searchQuery, categoryFilter]);

            const totalTasks = tasks.length;
            const completedTasks = tasks.filter(t => t.completed).length;
            const overdueTasks = tasks.filter(t => !t.completed && isOverdue(t.dueDate)).length;
            const todayTasks = tasks.filter(t => { if (!t.dueDate || t.completed) return false; return getDaysUntil(t.dueDate) === 0; }).length;

            return (
                <div className="space-y-4 sm:space-y-6 fade-in">
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div className="bg-white bg-opacity-5 backdrop-blur rounded-xl p-3 sm:p-4 border border-white border-opacity-10">
                            <div className="flex items-center gap-2 mb-1"><i data-lucide="list-todo" className="w-4 h-4 text-blue-400"></i><span className="text-gray-400 text-xs">סה״כ</span></div>
                            <div className="text-xl sm:text-2xl font-bold text-white">{totalTasks}</div>
                        </div>
                        <div className="bg-white bg-opacity-5 backdrop-blur rounded-xl p-3 sm:p-4 border border-white border-opacity-10">
                            <div className="flex items-center gap-2 mb-1"><i data-lucide="check-circle" className="w-4 h-4 text-green-400"></i><span className="text-gray-400 text-xs">הושלמו</span></div>
                            <div className="text-xl sm:text-2xl font-bold text-white">{completedTasks}</div>
                        </div>
                        <div className="bg-white bg-opacity-5 backdrop-blur rounded-xl p-3 sm:p-4 border border-white border-opacity-10">
                            <div className="flex items-center gap-2 mb-1"><i data-lucide="clock" className="w-4 h-4 text-orange-400"></i><span className="text-gray-400 text-xs">להיום</span></div>
                            <div className="text-xl sm:text-2xl font-bold text-white">{todayTasks}</div>
                        </div>
                        <div className="bg-white bg-opacity-5 backdrop-blur rounded-xl p-3 sm:p-4 border border-white border-opacity-10">
                            <div className="flex items-center gap-2 mb-1"><i data-lucide="alert-triangle" className="w-4 h-4 text-red-400"></i><span className="text-gray-400 text-xs">באיחור</span></div>
                            <div className="text-xl sm:text-2xl font-bold text-white">{overdueTasks}</div>
                        </div>
                    </div>

                    <div className="bg-white bg-opacity-5 backdrop-blur rounded-xl p-3 sm:p-4 border border-white border-opacity-10">
                        <div className="flex flex-col sm:flex-row gap-3">
                            <div className="relative flex-1">
                                <i data-lucide="search" className="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>

                            </div>
                            <div className="w-full bg-white bg-opacity-10 rounded-full h-2.5">
                                <div className="bg-gradient-to-r from-indigo-500 to-purple-500 h-2.5 rounded-full transition-all duration-500" style={{ width: `${totalTasks > 0 ? (completedTasks / totalTasks) * 100 : 0}%` }} />

        // ===== HABITS PANEL =====
        function HabitsPanel() {
            const today = new Date().toISOString().split('T')[0];

            const defaultHabits = [
                { id: 1, name: 'התעוררות מוקדמת (6:00)', xp: 20, color: 'bg-orange-500', category: 'בריאות' },
                { id: 2, name: 'אימון גופני 30 דק׳', xp: 30, color: 'bg-red-500', category: 'בריאות' },
                { id: 3, name: 'קריאה 20 דק׳', xp: 20, color: 'bg-blue-500', category: 'פרודוקטיביות' },
                { id: 4, name: 'מדיטציה 10 דק׳', xp: 15, color: 'bg-purple-500', category: 'בריאות' },
                { id: 5, name: 'תכנון יומי', xp: 15, color: 'bg-green-500', category: 'פרודוקטיביות' },
            ];

            const [habits, setHabits] = useFirestoreSync('habits', 'habits', defaultHabits);
            const [completedHabits, setCompletedHabits] = useFirestoreSync('habitData', 'habitData', {});

            const [editMode, setEditMode] = useState(false);
            const [editingHabit, setEditingHabit] = useState(null);
            const [showCelebration, setShowCelebration] = useState(false);
            const [celebrationMessage, setCelebrationMessage] = useState('');
            const [showAddForm, setShowAddForm] = useState(false);

            const toggleHabit = (habitId) => {
                setCompletedHabits(prev => {
                    const newCompleted = { ...prev };
                    if (!newCompleted[today]) newCompleted[today] = [];
                    if (newCompleted[today].includes(habitId)) {
                        newCompleted[today] = newCompleted[today].filter(id => id !== habitId);
                    } else {
                        newCompleted[today] = [...newCompleted[today], habitId];
                        if (newCompleted[today].length === habits.length) {
                            setCelebrationMessage('יום מושלם! כל ההרגלים הושלמו!');
                            setShowCelebration(true);
                            setTimeout(() => setShowCelebration(false), 3000);
                        }
                    }
                    return newCompleted;
                });
            };

            const getDailyXP = (date) => {
                const completed = completedHabits[date] || [];
                return completed.reduce((sum, habitId) => {
                    const habit = habits.find(h => h.id === habitId);
                    return sum + (habit ? habit.xp : 0);
                }, 0);
            };

            const maxDailyXP = habits.reduce((sum, h) => sum + h.xp, 0);
            const todayXP = getDailyXP(today);
            const todayProgress = maxDailyXP > 0 ? (todayXP / maxDailyXP) * 100 : 0;

            const calculateStreak = () => {
                let streak = 0;
                let currentDate = new Date();
                while (true) {
                    const dateStr = currentDate.toISOString().split('T')[0];
                    const completed = completedHabits[dateStr] || [];
                    if (completed.length === habits.length) {
                        streak++;
                        currentDate.setDate(currentDate.getDate() - 1);
                    } else if (dateStr === today && completed.length > 0) {
                        currentDate.setDate(currentDate.getDate() - 1);
                    } else { break; }
                }
                return streak;
            };

            const getWeeklyXP = () => {
                const now = new Date();
                const dayOfWeek = now.getDay();
                const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
                const monday = new Date(now);
                monday.setDate(now.getDate() + mondayOffset);
                let weekXP = 0;
                for (let i = 0; i < 7; i++) {
                    const date = new Date(monday);
                    date.setDate(monday.getDate() + i);
                    weekXP += getDailyXP(date.toISOString().split('T')[0]);
                }
                return weekXP;
            };

            const streak = calculateStreak();
            const weeklyXP = getWeeklyXP();

            const addHabit = (habitData) => {
                setHabits(prev => [...prev, {
                    id: Date.now(),
                    name: habitData.name || 'הרגל חדש',
                    xp: habitData.xp || 10,
                    color: habitData.color || 'bg-gray-500',
                    category: habitData.category || 'כללי'
                }]);
                setShowAddForm(false);
            };

            const updateHabit = (id, field, value) => {
                setHabits(prev => prev.map(h => h.id === id ? { ...h, [field]: value } : h));
            };

            const deleteHabit = (id) => {
                if (confirm('האם אתה בטוח שברצונך למחוק את ההרגל?')) {
                    setHabits(prev => prev.filter(h => h.id !== id));
                    setEditingHabit(null);
                }
            };

            const habitColors = [
                { value: 'bg-red-500', label: 'אדום' }, { value: 'bg-orange-500', label: 'כתום' },
                { value: 'bg-yellow-500', label: 'צהוב' }, { value: 'bg-green-500', label: 'ירוק' },
                { value: 'bg-blue-500', label: 'כחול' }, { value: 'bg-indigo-500', label: 'אינדיגו' },
                { value: 'bg-purple-500', label: 'סגול' }, { value: 'bg-pink-500', label: 'ורוד' }
            ];

            const todayCompleted = completedHabits[today] || [];

            return (
                <div className="space-y-4 sm:space-y-6 fade-in">
                    {showCelebration && (
                        <div className="fixed inset-0 flex items-center justify-center z-50 pointer-events-none px-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 text-center celebration-animation max-w-sm w-full">
                                <div className="text-5xl sm:text-6xl mb-4">🎉</div>
                                <div className="text-xl sm:text-2xl font-bold text-gray-800">{celebrationMessage}</div>
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-3 gap-3">
                        <div className="bg-white bg-opacity-5 backdrop-blur rounded-xl p-3 sm:p-4 border border-white border-opacity-10">
                            <div className="flex items-center gap-2 mb-1"><i data-lucide="target" className="w-4 h-4 text-blue-400"></i><span className="text-gray-400 text-xs">היום</span></div>
                            <div className="text-xl sm:text-2xl font-bold text-white">{todayXP}<span className="text-sm text-gray-400">/{maxDailyXP}</span></div>
                            <div className="mt-2 bg-white bg-opacity-10 rounded-full h-1.5">
                                <div className="bg-gradient-to-r from-blue-400 to-cyan-400 h-1.5 rounded-full transition-all duration-500" style={{ width: `${todayProgress}%` }} />
                            </div>
                        </div>
                        <div className="bg-white bg-opacity-5 backdrop-blur rounded-xl p-3 sm:p-4 border border-white border-opacity-10">
                            <div className="flex items-center gap-2 mb-1"><i data-lucide="flame" className="w-4 h-4 text-orange-400"></i><span className="text-gray-400 text-xs">סטריק</span></div>
                            <div className="text-xl sm:text-2xl font-bold text-white">{streak}</div>
                            <div className="text-orange-300 text-xs mt-1">ימים רצופים</div>
                        </div>
                        <div className="bg-white bg-opacity-5 backdrop-blur rounded-xl p-3 sm:p-4 border border-white border-opacity-10">
                            <div className="flex items-center gap-2 mb-1"><i data-lucide="calendar" className="w-4 h-4 text-green-400"></i><span className="text-gray-400 text-xs">שבועי</span></div>
                            <div className="text-xl sm:text-2xl font-bold text-white">{weeklyXP}</div>
                            <div className="text-green-300 text-xs mt-1">XP</div>
                        </div>
                    </div>

                    <div className="bg-white bg-opacity-5 backdrop-blur rounded-xl p-4 sm:p-6 border border-white border-opacity-10">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-lg sm:text-xl font-bold text-white">הרגלים יומיים</h2>
                            <div className="flex gap-2">
                                {editMode && (<button onClick={() => setShowAddForm(true)} className="p-2 bg-green-500 hover:bg-green-600 text-white rounded-lg transition touch-manipulation"><i data-lucide="plus" className="w-4 h-4"></i></button>)}
                                <button onClick={() => setEditMode(!editMode)} className={`p-2 rounded-lg transition touch-manipulation ${editMode ? 'bg-red-500 hover:bg-red-600' : 'bg-white bg-opacity-10 hover:bg-opacity-20'} text-white`}>
                                    <i data-lucide={editMode ? 'x' : 'settings'} className="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        {showAddForm && (
                            <div className="mb-4 p-4 bg-white bg-opacity-5 rounded-xl border border-white border-opacity-10 slide-up">
                                <form onSubmit={(e) => { e.preventDefault(); const fd = new FormData(e.target); addHabit({ name: fd.get('name'), xp: parseInt(fd.get('xp')), color: fd.get('color') }); e.target.reset(); }}>
                                    <div className="space-y-3">
                                        <input type="text" name="name" required placeholder="שם ההרגל" className="w-full px-4 py-2.5 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg text-white placeholder-gray-500 outline-none text-sm" />
                                        <div className="grid grid-cols-2 gap-3">
                                            <input type="number" name="xp" required placeholder="XP" defaultValue="10" min="1" className="px-4 py-2.5 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg text-white outline-none text-sm" />
                                            <select name="color" required className="px-4 py-2.5 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg text-white outline-none text-sm">
                                                {habitColors.map(c => (<option key={c.value} value={c.value} className="bg-gray-800">{c.label}</option>))}
                                            </select>
                                        </div>
                                        <div className="flex gap-2">
                                            <button type="submit" className="flex-1 py-2.5 bg-green-500 hover:bg-green-600 text-white rounded-lg transition text-sm touch-manipulation">הוסף</button>
                                            <button type="button" onClick={() => setShowAddForm(false)} className="px-4 py-2.5 bg-red-500 hover:bg-red-600 text-white rounded-lg transition text-sm touch-manipulation">ביטול</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        )}

                        <div className="space-y-2">
                            {habits.map(habit => {
                                const isCompleted = todayCompleted.includes(habit.id);
                                const isEditing = editingHabit === habit.id;
                                return (
                                    <div key={habit.id} className={`p-3 rounded-xl border-2 transition-all ${isCompleted ? 'bg-green-500 bg-opacity-10 border-green-500 border-opacity-50' : 'bg-white bg-opacity-5 border-white border-opacity-10 hover:bg-opacity-10'}`}>
                                        {isEditing ? (
                                            <div className="space-y-3">
                                                <input type="text" value={habit.name} onChange={e => updateHabit(habit.id, 'name', e.target.value)} className="w-full px-4 py-2.5 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg text-white outline-none text-sm" />
                                                <div className="grid grid-cols-2 gap-3">
                                                    <input type="number" value={habit.xp} onChange={e => updateHabit(habit.id, 'xp', parseInt(e.target.value) || 0)} className="px-4 py-2.5 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg text-white outline-none text-sm" />
                                                    <select value={habit.color} onChange={e => updateHabit(habit.id, 'color', e.target.value)} className="px-4 py-2.5 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg text-white outline-none text-sm">
                                                        {habitColors.map(c => (<option key={c.value} value={c.value} className="bg-gray-800">{c.label}</option>))}
                                                    </select>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => setEditingHabit(null)} className="flex-1 py-2.5 bg-green-500 hover:bg-green-600 text-white rounded-lg transition text-sm touch-manipulation">שמור</button>
                                                    <button onClick={() => deleteHabit(habit.id)} className="px-4 py-2.5 bg-red-500 hover:bg-red-600 text-white rounded-lg transition text-sm touch-manipulation">מחק</button>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="flex items-center gap-3">
                                                <button onClick={() => !editMode && toggleHabit(habit.id)} disabled={editMode} className={`flex-shrink-0 w-10 h-10 rounded-xl flex items-center justify-center transition-all touch-manipulation ${isCompleted ? `${habit.color} text-white scale-110` : 'bg-white bg-opacity-10 text-gray-400 hover:bg-opacity-20'}`}>
                                                    {isCompleted && <i data-lucide="check" className="w-5 h-5"></i>}
                                                </button>
                                                <div className="flex-1 min-w-0">
                                                    <div className={`font-medium text-sm ${isCompleted ? 'text-green-300' : 'text-white'}`}>{habit.name}</div>
                                                    <div className="flex items-center gap-1.5 text-xs text-gray-400 mt-0.5"><i data-lucide="star" className="w-3 h-3 text-yellow-400"></i>{habit.xp} XP</div>
                                                </div>
                                                {editMode && (<button onClick={() => setEditingHabit(habit.id)} className="p-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition touch-manipulation"><i data-lucide="edit-2" className="w-3.5 h-3.5"></i></button>)}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        {habits.length > 0 && (
                            <div className="mt-4 p-3 bg-white bg-opacity-5 rounded-xl border border-white border-opacity-10">
                                <div className="flex justify-between items-center text-white">
                                    <span className="text-sm text-gray-300">התקדמות יומית</span>
                                    <span className="text-lg font-bold">{todayCompleted.length}/{habits.length}</span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ===== BOTS PANEL =====
        function BotsPanel() {

                <div className="fade-in">
                    <div className="text-center py-20">
                        <div className="w-20 h-20 bg-cyan-500 bg-opacity-20 rounded-2xl flex items-center justify-center mx-auto mb-6">

                        <div className="mt-8 inline-flex items-center gap-2 px-6 py-3 bg-cyan-500 bg-opacity-10 border border-cyan-500 border-opacity-30 rounded-xl text-cyan-300">

        function AnalyticsPanel() {

                        <div className="mt-8 inline-flex items-center gap-2 px-6 py-3 bg-green-500 bg-opacity-10 border border-green-500 border-opacity-30 rounded-xl text-green-300">

        // ===== MAIN DASHBOARD =====
        function Dashboard() {
            const { user, loading, signInWithGoogle, signOut, firebaseReady } = useAuth();
            const [activePanel, setActivePanel] = useState(() => {
                return localStorage.getItem('dashboard_activePanel') || 'tasks';
            });
            const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

            useEffect(() => {
                localStorage.setItem('dashboard_activePanel', activePanel);
            }, [activePanel]);

            // Show login screen only if Firebase is configured but user isn't logged in
            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950 flex items-center justify-center">
                        <div className="text-center">
                            <i data-lucide="loader-2" className="w-8 h-8 text-indigo-400 mx-auto spin-slow"></i>
                            <p className="text-gray-400 mt-4">טוען...</p>
                        </div>
                    </div>
                );
            }

            if (firebaseReady && !user) {
                return <LoginScreen />;
            }

            const renderPanel = () => {
                switch (activePanel) {
                    case 'tasks': return <TasksPanel />;
                    case 'habits': return <HabitsPanel />;
                    case 'bots': return <BotsPanel />;
                    case 'analytics': return <AnalyticsPanel />;
                    case 'settings': return <SettingsPanel />;
                    default: return <TasksPanel />;
                }
            };

            const activeNav = NAV_ITEMS.find(n => n.id === activePanel);

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950 flex">
                    {/* Desktop Sidebar */}
                    <aside className={`sidebar-desktop fixed right-0 top-0 h-full z-30 transition-all duration-300 ${sidebarCollapsed ? 'w-16' : 'w-56'} bg-black bg-opacity-40 backdrop-blur-xl border-l border-white border-opacity-10`}>
                        <div className="p-4 border-b border-white border-opacity-10">
                            <div className="flex items-center gap-3">
                                <div className="flex-shrink-0 w-9 h-9 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center">
                                    <i data-lucide="layout-dashboard" className="w-5 h-5 text-white"></i>
                                </div>
                                {!sidebarCollapsed && (
                                    <div>
                                        <h1 className="text-white font-bold text-sm">לוח בקרה</h1>
                                        <p className="text-gray-500 text-xs">מרכז הניהול שלי</p>
                                    </div>
                                )}
                            </div>
                        </div>

                        <nav className="p-2 space-y-1 mt-2">
                            {NAV_ITEMS.map(item => (
                                <button key={item.id} onClick={() => setActivePanel(item.id)}
                                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all touch-manipulation ${activePanel === item.id ? 'nav-item-active text-white' : 'text-gray-400 hover:text-white hover:bg-white hover:bg-opacity-5'}`}>
                                    <i data-lucide={item.icon} className={`w-5 h-5 flex-shrink-0 ${activePanel === item.id ? item.color : ''}`}></i>
                                    {!sidebarCollapsed && <span className="text-sm font-medium">{item.label}</span>}
                                </button>
                            ))}
                        </nav>

                        {/* User info at bottom */}
                        <div className="absolute bottom-12 left-0 right-0 px-2">
                            {user && !sidebarCollapsed && (
                                <div className="flex items-center gap-2 px-3 py-2 rounded-xl bg-white bg-opacity-5">
                                    <div className="w-6 h-6 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">
                                        {(user.email || '?')[0].toUpperCase()}
                                    </div>
                                    <span className="text-xs text-gray-400 truncate">{user.displayName || user.email}</span>
                                </div>
                            )}
                        </div>

                        <div className="absolute bottom-4 left-0 right-0 px-2">
                            <button onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                                className="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-xl text-gray-500 hover:text-white hover:bg-white hover:bg-opacity-5 transition touch-manipulation">
                                <i data-lucide={sidebarCollapsed ? 'chevron-left' : 'chevron-right'} className="w-4 h-4"></i>
                                {!sidebarCollapsed && <span className="text-xs">כווץ תפריט</span>}
                            </button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className={`flex-1 transition-all duration-300 ${sidebarCollapsed ? 'md:mr-16' : 'md:mr-56'}`}>
                        <header className="sticky top-0 z-20 bg-gray-950 bg-opacity-80 backdrop-blur-xl border-b border-white border-opacity-10">
                            <div className="px-4 sm:px-6 py-3 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    {activeNav && <i data-lucide={activeNav.icon} className={`w-5 h-5 ${activeNav.color}`}></i>}
                                    <h2 className="text-lg font-bold text-white">{activeNav?.label || 'לוח בקרה'}</h2>
                                </div>
                                <div className="flex items-center gap-3">
                                    <SyncIndicator />
                                    <div className="text-xs text-gray-500 hidden sm:block">
                                        {new Date().toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
                                    </div>
                                </div>
                            </div>
                        </header>

                        <div className="p-4 sm:p-6 pb-24 md:pb-6">
                            {renderPanel()}
                        </div>
                    </main>

                    {/* Mobile Bottom Navigation */}
                    <nav className="mobile-bottom-nav fixed bottom-0 left-0 right-0 z-30 bg-gray-950 bg-opacity-95 backdrop-blur-xl border-t border-white border-opacity-10">
                        <div className="flex justify-around items-center py-2 px-2">
                            {NAV_ITEMS.map(item => (
                                <button key={item.id} onClick={() => setActivePanel(item.id)}
                                    className={`flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl transition-all touch-manipulation ${activePanel === item.id ? 'text-white' : 'text-gray-500'}`}>
                                    <i data-lucide={item.icon} className={`w-5 h-5 ${activePanel === item.id ? item.color : ''}`}></i>
                                    <span className="text-[10px] font-medium">{item.label}</span>
                                    {activePanel === item.id && (<div className={`w-1 h-1 rounded-full mt-0.5 ${item.color.replace('text-', 'bg-')}`}></div>)}
                                </button>
                            ))}
                        </div>
                    </nav>
                </div>
            );
        }

        // ===== APP ROOT =====
        function App() {
            return (
                <AuthProvider>
                    <Dashboard />
                </AuthProvider>
            );
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Initialize Lucide icons
        lucide.createIcons();
        const observer = new MutationObserver(() => { lucide.createIcons(); });
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>
</body>
</html>
